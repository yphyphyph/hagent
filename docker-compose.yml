# ============================================================
# HAgent 生产部署（Docker Compose）
# 用法：
#   1. 准备凭据：复制 hagent-back/.env.example 为本目录 .env 并填入真实值
#   2. 一键部署：./start_hagent.sh（或 docker compose up -d --build）
# ============================================================
services:
  backend:
    build:
      context: ./hagent-back
      dockerfile: Dockerfile
    container_name: hagent-backend
    ports:
      - "8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # PostgreSQL + pgvector：默认指向线上库（见 .env 的 HAGENT_DB_HOST）
      - DB_URL=${DB_URL:-jdbc:postgresql://${HAGENT_DB_HOST:-host.docker.internal}:5432/hagent?stringtype=unspecified}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - HAGENT_DB_PASSWORD=${HAGENT_DB_PASSWORD}
      # Redis：AI 向量库与 Sa-Token 会话共用，默认走宿主机实例
      - HAGENT_REDIS_HOST=${HAGENT_REDIS_HOST:-host.docker.internal}
      - HAGENT_REDIS_PORT=${HAGENT_REDIS_PORT:-6379}
      - HAGENT_REDIS_PASSWORD=${HAGENT_REDIS_PASSWORD}
      # 阿里云 OSS（知识库文件上传）
      - HAGENT_OSS_ACCESS_KEY_ID=${HAGENT_OSS_ACCESS_KEY_ID}
      - HAGENT_OSS_ACCESS_KEY_SECRET=${HAGENT_OSS_ACCESS_KEY_SECRET}
      # JWT 遗留链路启动校验用，生产建议显式注入随机长串
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-hagent-prod-secret-key-please-replace-me-with-random-0123456789}
      # JVM 参数（镜像内已含 G1 与 OOM Dump 默认值，可按机器规格覆盖）
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: always

  frontend:
    build:
      context: ./hagent-ui
      dockerfile: Dockerfile
    container_name: hagent-frontend
    ports:
      - "3002:80"
    restart: always
    depends_on:
      - backend
